name: Run iOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to build, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  run:
    name: Trigger EAS iOS release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use X.Y.Z semantic versioning."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS workflow
        run: |
          eas workflow:run .eas/workflows/release-ios.yml \
            --ref "v$RELEASE_VERSION" \
            --non-interactive \
            --wait
