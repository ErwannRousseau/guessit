name: Release iOS to TestFlight

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  testflight:
    name: Upload iOS build to TestFlight
    needs:
      - build_ios
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
